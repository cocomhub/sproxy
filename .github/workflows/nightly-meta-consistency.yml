name: Nightly meta consistency

on:
  schedule:
    # 每天 03:00 UTC；仅用于发现跨存储 meta 回归，不阻塞普通 PR。
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  # nightly 失败要自动开 issue（否则 nightly = 无人看的死流程：调度失败默认只给最后改 cron 的人发邮件）
  issues: write

jobs:
  meta-consistency:
    name: local + S3 meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "1.27"
          check-latest: true

      # 镜像**按 digest 固定**：本仓已因镜像来源问题连改两轮（#1338 quay → #1339 elestio），
      # 根因是跟随 `latest` —— 上游一推新 digest 就可能让 nightly 神秘失效，且无法复现当时
      # 通过的组合。升级镜像时改这里（`docker buildx imagetools inspect <image>` 取 digest）。
      # 镜像**按 digest 固定**：本仓已因镜像来源问题连改两轮（#1338 quay → #1339 elestio），
      # 根因是跟随 `latest` —— 上游一推新 digest 就可能让 nightly 神秘失效，且无法复现当时
      # 通过的组合。升级镜像时改这里（`docker buildx imagetools inspect <image>` 取 digest）。
      - name: start MinIO
        env:
          MINIO_IMAGE: elestio/minio@sha256:25348a257f1ece1b192f25f6cd9854618fa86422ac87b494b5d4e629c556d4bd
        run: |
          docker run -d --name sproxy-nightly-minio \
            -p 19000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            "$MINIO_IMAGE" server /data
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:19000/minio/health/ready >/dev/null; then break; fi
            sleep 1
          done
          docker run --rm --network host --entrypoint sh "$MINIO_IMAGE" -c \
            "mc alias set local http://127.0.0.1:19000 minioadmin minioadmin && mc mb --ignore-existing local/sproxy"
      - name: build sproxy
        run: |
          make prepare
          go build -o /tmp/sproxy ./cmd/sproxy

      - name: start sproxy
        run: |
          mkdir -p /tmp/sproxy-nightly/data
          cat > /tmp/sproxy-nightly.yaml <<'YAML'
          addr: "127.0.0.1:18195"
          storage_root: "/tmp/sproxy-nightly/data"
          log_level: "info"
          log_format: "text"
          tls:
            enabled: false
          api_keys:
            enabled: true
            keys:
              - name: nightly
                key: nightly-token
                permission: write
          # versioning 开启：让「同名不同内容 ⇒ 覆盖」分支真正执行（关闭时服务端 409，
          # 用例会退化为「拒绝后原样保留」断言——两条分支都要有覆盖，故这里主动开启）。
          versioning:
            enabled: true
            max_versions: 2
          volumes:
            - name: main
              type: local
              root: "/tmp/sproxy-nightly/data/main"
            - name: s3
              type: s3
              extra:
                endpoint: "127.0.0.1:19000"
                bucket: "sproxy"
                access_key: "minioadmin"
                secret_key: "minioadmin"
                region: "us-east-1"
                use_ssl: false
                allow_presign: true
          YAML
          /tmp/sproxy --config /tmp/sproxy-nightly.yaml > /tmp/sproxy-nightly.log 2>&1 &
          echo $! > /tmp/sproxy-nightly.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18195/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sproxy-nightly.log
          exit 1

      - name: run meta consistency
        env:
          SPROXY_META_E2E_URL: http://127.0.0.1:18195
          SPROXY_META_E2E_BEARER: nightly-token
          SPROXY_META_E2E_VOLUMES: main,s3
        run: |
          go test -tags=e2e -run 'TestMetaConsistencyRealVolumes|TestOverwriteConsistencyRealVolumes|TestIdempotentReuploadRealVolumes|TestOverwriteDefaultRouteRealVolumes' -v ./test/e2e

      # nightly 失败必须**有人看得见**：扫描式流程失败时没人盯着 Actions 页面，「每天绿/红」
      # 变成背景噪声。此处开（或复用一个仍 OPEN 的）issue，并带上失败 job 链接。
      - name: report failure
        if: failure()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const title = 'nightly: 跨存储 meta 一致性失败';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const NL = String.fromCharCode(10);
            const body = ['运行链接：' + run, '', '失败详情见 run 的日志与 nightly-meta-logs artifact。'].join(NL);
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'nightly', per_page: 5,
            });
            const exist = open.data.find((x) => x.title === title);
            if (exist) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: exist.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['nightly'],
              });
            }
      - name: cleanup
        if: always()
        run: |
          if [ -f /tmp/sproxy-nightly.pid ]; then kill "$(cat /tmp/sproxy-nightly.pid)" 2>/dev/null || true; fi
          docker rm -f sproxy-nightly-minio 2>/dev/null || true

      - name: upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-meta-logs
          path: /tmp/sproxy-nightly.log
          if-no-files-found: ignore
          retention-days: 7
