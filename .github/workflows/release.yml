name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # 供 release-please 在创建 tag 后复用本 workflow：GITHUB_TOKEN 创建的事件不会
  # 再触发 push 型 workflow（GitHub 的防递归限制），故 release-please.yml 直接调用
  # 本 reusable workflow，并用输入 tag 检出发布点（无需 PAT）。
  workflow_call:
    inputs:
      tag:
        description: "要发布的 tag（release-please 的 tag_name）。为空时回落到触发 ref。"
        required: false
        type: string
  # 手动演练 / 补发指定 tag（不依赖 release-please）。
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v0.11.0）"
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # 直接触发时 inputs.tag 为空 ⇒ 回落 github.ref（refs/tags/vX.Y.Z）。
          ref: ${{ inputs.tag || github.ref }}

      # workflow_call / workflow_dispatch 必须显式给 tag：否则 ref 会退到默认分支，
      # GoReleaser 要么响亮失败、要么有误发风险。
      - name: Validate tag input
        if: github.event_name != 'push'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::inputs.tag 为空：workflow_call/workflow_dispatch 必须显式传入 tag"
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          check-latest: true

      # 子 module tag 自动化（PR #367）：release-please 只创建根 tag vX.Y.Z——Go 官方要求
      # 嵌套 module（cmd/sproxy 等）的 tag 形如 <module-path>/vX.Y.Z，缺了 `go get` 无法解析
      # 该 module 版本。本步按 CHANGELOG 版本为全部子 module 补建 tag（scripts/tag-release.sh
      # 动态扫描 go.work，逐条显式 refspec 推送，不用 git push --tags）。
      #
      # 安全：推 cmd/sproxy/v* 等子 module tag 不匹配本 workflow 的 push 触发模式 `v*.*.*`
      # （首字符 c/p/web 非 v）→ 不递归触发 release。
      # 容错：子 module tag 缺失是警告级（不阻塞发布主流程）——失败仅告警，GoReleaser 继续。
      - name: Create sub-module tags (tag-release)
        run: scripts/tag-release.sh --apply --push || echo "::warning::tag-release 补建子 module tag 失败（不阻塞发布）"

      # 兵底：GoReleaser 前先生成 buildmeta 的 embed 依赖
      # （build/dirty_info.txt 被 .gitignore 忽略）。
      # 新 tag 由 .goreleaser.yaml 的 before.hooks 保证；
      # 历史 tag（如 v0.11.1）没有该 hook，而 workflow_dispatch
      # 会 checkout tag 自身内容 ⇒ 由 workflow 侧兵底：
      # 本步用 tag 自带 Makefile，已能生成 embed 副本。
      - name: prepare (buildmeta embed)
        run: make prepare

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 显式解析 previous tag（根 tag 链）：GoReleaser 自身的 previousTagSha 用
      # `git describe --exclude …` 定位，而嵌套 module tag（cmd/sproxy/vX.Y.Z、
      # web/e2e/vX.Y.Z …）在 filterOut 的精确字符串排除下匹配不掉（glob 不跨 /），
      # 会污染 previous。--match 'v[0-9]*' 从根源上只认根 tag。
      - name: Resolve previous tag
        id: prevtag
        run: |
          CUR="${{ inputs.tag || github.ref_name }}"
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "tags/${CUR}^" 2>/dev/null || echo "")
          echo "prev=$PREV"
          echo "previous=$PREV" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 与 make build 的 -X buildinfo.Branch 对齐：release 检出的是 tag（detached
          # HEAD，`git rev-parse --abbrev-ref HEAD` 只能得到 HEAD），故显式注入默认分支名。
          SPROXY_BRANCH: ${{ github.event.repository.default_branch }}
          # v0.18.0 发布事故（2026-09-22）：GoReleaser 的 getTag 有 3 级优先级——
          # GORELEASER_CURRENT_TAG env > `git tag --points-at HEAD` > `git describe`；
          # 只有 describe 走 ignore_tags 的 --exclude，而 filterOut 是精确字符串匹配
          # （web/* 匹配不到 web/e2e/v0.18.0）⇒ 发布提交上 --points-at 排序第一的
          # 嵌套 tag 直接污染 current → `failed to parse tag 'web/e2e/v0.18.0' as semver`。
          # 显式注入 env（优先级最高）彻底绕过 points-at/describe。
          GORELEASER_CURRENT_TAG: ${{ inputs.tag || github.ref_name }}
          # previous 同样显式注入（见上方 Resolve previous tag 步骤）。
          GORELEASER_PREVIOUS_TAG: ${{ steps.prevtag.outputs.previous }}
