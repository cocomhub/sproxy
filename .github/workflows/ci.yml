name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.release-please-manifest.json'
      - '.gitignore'
      - '.editorconfig'
      - '.notestignore'
      - '.dockerignore'
      - '.golangci.yml.bak'
      - 'LICENSE'
  pull_request:
    branches: [master]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.release-please-manifest.json'
      - '.gitignore'
      - '.editorconfig'
      - '.notestignore'
      - '.dockerignore'
      - '.golangci.yml.bak'
      - 'LICENSE'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "1.27"
          check-latest: true

      - name: prepare (buildmeta embed)
        run: make prepare

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2
          args: --timeout=5m ./...

      # 上面的 `./...` 只覆盖根 module：其余 10 个模块（cmd/sproxy、cmd/sclient、
      # pkg/tunnel/mesh、pkg/tunnel/hub/ext/kad、pkg/tunnel/xfer/ext/{grpc,quic,webrtc,ws}、
      # pkg/certmgr/ext/dnspod、pkg/telemetry/ext/otel，完整清单见 Makefile 的
      # SUB_MODULE_DIRS）都是**独立 module**，`golangci-lint run ./...` 不跨 module，
      # 这些 module 的 lint 问题会静默游离在门禁之外（曾发生：cmd/sclient 的 2 处恒真
      # 守卫带 3 条 staticcheck SA4023 issue，而根 lint 全绿）。此处逐个 module 各跑一次。
      # 二进制由上面的 action 提供：其 run() 无条件执行 core.addPath(dirname(binPath))
      # （install-only 返回前也已执行），故后续步骤 PATH 中已有 golangci-lint。
      # 本地同一门禁为 `make lint-all`，且已并入 `make check-ci`。
      - name: golangci-lint (all sub-modules)
        run: make lint-all

      # 死代码门禁：`make deadcode` 只是信息输出（不带 -test 时必然报测试替身），
      # 无法直接当失败条件；deadcode-check 加了显式豁免清单（.deadcodeignore）后按失败判定。
      - name: deadcode (no unregistered unreachable symbols)
        run: make deadcode-check

      # 测试文件存在性门禁：此前该目标不带参数调用脚本 ⇒ 循环零次 ⇒ 恒打印 OK（假门禁）；
      # 修复（#270 后）后此处才真正生效：任何无测试的包（除 .notestignore 登记项）会报红。
      - name: notest (every package has tests)
        run: make notest

  test:
    name: Test (ubuntu, +Vault)
    runs-on: ubuntu-latest
    # Vault dev container（ubuntu 专属：windows runner 不支持 services → L2/L3 拆到
    # test-windows job，仅 L1 + vault 用例自动 t.Skip）。health-cmd 200 就绪后 make test
    # 全量跑，vault_integration_test.go 检测 VAULT_ADDR 可达 → 不 skip 实跑 L2/L3。
    services:
      vault:
        image: hashicorp/vault:1.18
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root
        ports:
          - 8200:8200
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8200/v1/sys/health || exit 1"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
      minio:
        image: quay.io/minio/minio:RELEASE.2024-09-22T00-33-43Z
        entrypoint: minio
        command: server /data
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000' || exit 1"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
      webdav:
        image: hacdias/webdav:v5
        command: --address :6065 --directory /data
        ports:
          - 6065:6065
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6065' || exit 1"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "1.27"
          check-latest: true

      - name: prepare (buildmeta embed)
        run: make prepare

      - name: go vet
        run: make vet

      - name: go test (race, incl Vault L2/L3)
        run: VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=root S3_ENDPOINT=127.0.0.1:9000 WEBDAV_ENDPOINT=http://127.0.0.1:6065 make test

      - name: go test (coverage)
        run: make cover-check

      # 协议面 fuzz（限时）：mux 帧解析 / TCP 帧定界 / tunnel 元数据头。
      # 限时 30s（go test -fuzz 的 fuzztime）——本仓 Benchmark job 多次因长任务
      # 超时（6 分钟 job 上限），fuzz 同理必须限时，防 CI 超时；三个目标均为
      # 纯内存/bytes 输入，无网络与墙钟依赖，适合 CI 短跑。
      # 注：seed corpus 由 f.Add 内联，不落 testdata 目录（避免每次 fuzz 后
      # 新增 corpus 脏文件）。
      - name: fuzz (bounded, protocol parsers)
        run: |
          go test -count=1 -fuzz=FuzzDecodeFrame -fuzztime=30s ./pkg/tunnel/mux/ &&
          go test -count=1 -fuzz=FuzzTcpFraming -fuzztime=30s ./pkg/tunnel/xfer/internal/tcp/ &&
          go test -count=1 -fuzz=FuzzTunnelMetaFrame -fuzztime=30s ./pkg/tunnel/

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-ubuntu
          path: build/cover.out

      - name: Upload coverage to CodeCov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: build/cover.out
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  test-windows:
    name: Test (windows)
    runs-on: windows-latest
    # windows runner 无 docker services → vault 集成测试 t.Skip，仅 L1 实跑。
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "1.27"
          check-latest: true

      - name: Ensure make (Windows)
        run: choco install make -y

      - name: prepare (buildmeta embed)
        run: make prepare

      - name: go vet
        run: make vet

      - name: go test (race)
        run: make test

  test-submodules:
    name: Test Sub-Modules (cmd + ext + hub + mesh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "1.27"
          check-latest: true
      - name: prepare (buildmeta embed)
        run: make prepare
      - name: go test all sub-modules (race)
        run: make test-all
      # 发布脚本门禁：tag-release.sh 的计划/SKIP/同源/安全默认由纯 bash 夹具钉住
      # （临时 git 仓库，不触碰本仓库）。挂在**必检**的 test-submodules job 内。
      - name: tag-release script tests
        run: make test-tag-release

  e2e:
    name: E2E (real binaries)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "1.27"
          check-latest: true
      - name: Ensure make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y
      - name: prepare (buildmeta embed)
        run: make prepare
      # e2e 套件带 //go:build e2e，默认 tags 的 lint job 扫不到；此处显式按 e2e tag
      # lint test/...（含 test/e2e/ 子包），与本地 make lint-e2e 同一门禁。
      # 置于耗时的真二进制 e2e 之前，让 lint 失败快速暴露。
      # 仅 Linux：Windows runner 的 checkout 按 core.autocrlf 将 LF 转 CRLF，gofmt 会误报；
      # Windows 仍跑真二进制 e2e（测试本身跨平台）。
      - name: golangci-lint (e2e build tag)
        if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2
          args: --timeout=5m --build-tags=e2e ./test/...
      - name: go test e2e (real binaries)
        run: make test-e2e

  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "1.27"
          check-latest: true

      - name: Build sproxy + sclient
        run: make build-ci GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}

      - name: Build all sub-modules
        run: make build-all

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/bin/

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    # 卡死自愈：正常 3~5 分钟；曾有 runner 争用导致 30~40 分钟（重试即好）。
    # 用 GitHub 自身超时兜底，避免一直占着必检项不返回（人工轮询规则见
    # docs/superpowers/learnings/2026-09-13-ci-merge-process.md §2）。
    timeout-minutes: 6
    permissions:
      contents: write   # auto-push 需要
      deployments: write
      pull-requests: write # 允许创建PR Review评论
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "1.27"
          check-latest: true
      - name: Run benchmark
        run: make bench
      # 卡死/失败时保留证据：`make bench` 现经 tools/benchwatch（进程外看门狗）运行，
      # 停滞会在 ~2 分钟内**以非零码失败**（而非被 job 级 timeout-minutes 静默取消）⇒
      # 以下 `if: always()` / `if: failure()` 步骤会执行，输出文件与日志尾部得以保留。
      - name: Dump benchmark output tail (failure diagnostics)
        if: failure() || cancelled()
        run: |
          echo "=== build/bench/output.txt (tail 80) ==="
          tail -n 80 build/bench/output.txt || true
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        continue-on-error: true
        with:
          tool: 'go'
          output-file-path: build/bench/output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '100%'
          comment-on-alert: true
          fail-on-alert: false
          skip-fetch-gh-pages: false
          comment-always: true
          summary-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
      - name: Upload benchmark artifact
        # 无条件上传：`Run benchmark` 被取消/失败时也要拿到 build/bench/（含 output.txt 部分日志），
        # 否则卡死现场只剩 runner 的 `Terminate orphan process`、无任何可诊断内容（2026-09-16 实证）。
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-results
          path: build/bench/
          retention-days: 3

  sonar:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "1.27"
          check-latest: true

      - name: go test (coverage)
        run: make cover-check

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ui-e2e:
    name: UI E2E Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "1.27"
      - name: Lint web/e2e module
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        env:
          GOWORK: "off"
        with:
          version: v2.13.2
          working-directory: web/e2e
          args: --timeout=5m -c ../../.golangci.yml ./...
      - name: Install Playwright browsers
        run: |
          cd web/e2e
          GOWORK=off go run github.com/mxschmitt/playwright-go/cmd/playwright install --with-deps chromium
      # 前端 JS 单测 + 语法检查（`node --check` / `node --test`）。
      # 放在**必检项** ui-e2e job 内：前端只有「真实浏览器 e2e」一道防线时，纯函数回归（渲染/格式化）
      # 会在 e2e 覆盖不到的角落静默变坏；两道一起跑才能保证「改坏了就红」。
      - name: Run Web UI JS unit tests
        run: make web-test
      - name: Run UI E2E tests
        run: |
          cd web/e2e
          GOWORK=off go test -v -count=1 -timeout=600s ./...
