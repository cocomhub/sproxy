name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.gitignore'
      - '.editorconfig'
      - '.notestignore'
      - '.dockerignore'
      - '.golangci.yml.bak'
      - 'LICENSE'
  pull_request:
    branches: [master]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.gitignore'
      - '.editorconfig'
      - '.notestignore'
      - '.dockerignore'
      - '.golangci.yml.bak'
      - 'LICENSE'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: prepare (buildmeta embed)
        run: make prepare

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m ./...

  test:
    name: Test (Go 1.26, ubuntu, +Vault)
    runs-on: ubuntu-latest
    # Vault dev container（ubuntu 专属：windows runner 不支持 services → L2/L3 拆到
    # test-windows job，仅 L1 + vault 用例自动 t.Skip）。health-cmd 200 就绪后 make test
    # 全量跑，vault_integration_test.go 检测 VAULT_ADDR 可达 → 不 skip 实跑 L2/L3。
    services:
      vault:
        image: hashicorp/vault:1.18
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root
        ports:
          - 8200:8200
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8200/v1/sys/health || exit 1"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: prepare (buildmeta embed)
        run: make prepare

      - name: go vet
        run: make vet

      - name: go test (race, incl Vault L2/L3)
        run: VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=root make test

      - name: go test (coverage)
        run: make cover-check

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ubuntu
          path: build/cover.out

      - name: Upload coverage to CodeCov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: build/cover.out
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  test-windows:
    name: Test (Go 1.26, windows)
    runs-on: windows-latest
    # windows runner 无 docker services → vault 集成测试 t.Skip，仅 L1 实跑。
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Ensure make (Windows)
        run: choco install make -y

      - name: prepare (buildmeta embed)
        run: make prepare

      - name: go vet
        run: make vet

      - name: go test (race)
        run: make test

  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Build sproxy + sclient
        run: make build-ci GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}

      - name: Build all sub-modules
        run: make build-all

      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/bin/

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: write   # auto-push 需要
      deployments: write
      pull-requests: write # 允许创建PR Review评论
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "1.26"
          check-latest: true
      - name: Run benchmark
        run: make bench
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        continue-on-error: true
        with:
          tool: 'go'
          output-file-path: build/bench/output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '100%'
          comment-on-alert: true
          fail-on-alert: false
          skip-fetch-gh-pages: false
          comment-always: true
          summary-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: build/bench/
          retention-days: 3

  sonar:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: go test (coverage)
        run: make cover-check

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ui-e2e:
    name: UI E2E Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "1.26"
      - name: Install Playwright browsers
        run: |
          cd web/e2e
          GOWORK=off go run github.com/mxschmitt/playwright-go/cmd/playwright install --with-deps chromium
      - name: Run UI E2E tests
        run: |
          cd web/e2e
          GOWORK=off go test -v -count=1 -timeout=120s ./...
