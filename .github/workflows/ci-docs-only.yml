#
# 文档专用「通过」workflow：让纯文档 PR（只改 paths-ignore 命中的路径）也能满足
# master ruleset 的 8 项必检，而**不必真正跑完整 CI**。
#
# 原理（GitHub 官方支持的同名检查覆盖 + 分支 ruleset 的 required_status_checks
# 按检查名匹配）：
#   - ci.yml 对纯文档 PR 完全不触发（paths-ignore）⇒ 8 项必检永不出现 ⇒ 无法合并。
#   - 本 workflow 用「恰好等于 ci.yml paths-ignore 的反向路径条件」触发——纯文档 PR
#     只触发本 workflow（ci.yml 不触发），此时以**相同的检查名**跑一个秒级 job 并
#     报 success；混合 PR（含代码改动）则两个 workflow 都触发，ci.yml 的真实检查
#     仍照常门禁（同名多 run 取最新、任一失败即 block）。
#   - 匹配 job 名：见下方每个 job 的 name，与 ci.yml / ruleset 完全一致。
#
# 为什么这样而不是改 ruleset：ruleset 无 per-path 的必检豁免，且 GitHub 推荐做法
# 就是「用同名检查占位」；改 ruleset 会削弱全部 PR 的保护（已实测 PUT 权限存在，
# 但这是退路，不是首选）。
#
# 注意：推送类型本 workflow 也触发（master 直接推送也在 paths-ignore 命中时跑），
# 避免纯文档 master 推送被卡（该情况由 ruleset 的 required_status_checks 按名匹配
# 本 workflow 的检查）。

name: CI (docs-only)

on:
  push:
    branches: [master]
    paths:
      - '*.md'
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.gitignore'
      - '.editorconfig'
      - '.notestignore'
      - '.dockerignore'
      - '.golangci.yml.bak'
      - 'LICENSE'
  pull_request:
    branches: [master]
    paths:
      - '*.md'
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.gitignore'
      - '.editorconfig'
      - '.notestignore'
      - '.dockerignore'
      - '.golangci.yml.bak'
      - 'LICENSE'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Docs-only OK
        run: echo "文档改动：本 job 仅为满足必检项占位（无代码改动，无需真实 lint）"

  test:
    name: Test (ubuntu, +Vault)
    runs-on: ubuntu-latest
    steps:
      - name: Docs-only OK
        run: echo "文档改动：占位"

  test-windows:
    name: Test (windows)
    runs-on: windows-latest
    steps:
      - name: Docs-only OK
        run: echo "文档改动：占位"

  test-submodules:
    name: Test Sub-Modules (cmd + ext + hub + mesh)
    runs-on: ubuntu-latest
    steps:
      - name: Docs-only OK
        run: echo "文档改动：占位"

  e2e:
    name: E2E (real binaries) (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Docs-only OK
        run: echo "文档改动：占位"

  sonar:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - name: Docs-only OK
        run: echo "文档改动：占位"

  ui-e2e:
    name: UI E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Docs-only OK
        run: echo "文档改动：占位"
