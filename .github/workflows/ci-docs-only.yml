name: CI (docs-only)

# 文档专用「通过」workflow：让纯文档 PR（只改 paths-ignore 命中的路径）也能满足
# master ruleset 的 8 项必检，而**不必真正跑完整 CI**。
#
# ⚠️ 触发器表达式的限制（2026-09-17 用户追问后改进）：
#   GitHub Actions 的 `paths` / `paths-ignore` 是**逐文件匹配后 OR**，且表达式**无法
#   表达「非 .go」这类集合差/否定** ⇒ **纯靠 paths-ignore 无法让「混合代码 PR（含
#   *.go 变更）」跳过本 workflow**。mixed PR 里既有 .md（命中本 paths）又有 .go
#   （命中 ci.yml 非忽略）时，两路都会触发。
#
#   正确做法（本文件采用）：**job 级 `if` + 前置 detect**——detect 用 `git diff` 精确
#   计算本次变更集，仅当「改动全部落在忽略清单（*.md/docs 等）」时才启用下方 8 个
#   与 ruleset 必检**同名**的占位检查；否则全部 skip ⇒ 混合 PR **不产出任何同名
#   检查** ⇒ 只有真实 CI（ci.yml）门禁，docs-only 不再凑热闹。
#
#   说明：即使不做此层 if，现状也没有安全漏洞（同名检查取最新状态，真实 CI 失败
#   时同名检查终为 failure、ruleset 照常 block）；本层 `if` 的价值是**消除混合 PR
#   里的 docs-only 噪音 run**（少 8 个空转 echo job）。
#
#   匹配 job 名：下方 job 的 name 与 ci.yml / ruleset 完全一致（同名占位检查）。

on:
  push:
    branches: [master]
    paths:
      - '*.md'
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.release-please-manifest.json'
      - '.gitignore'
      - '.editorconfig'
      - '.notestignore'
      - '.dockerignore'
      - '.golangci.yml.bak'
      - 'LICENSE'
  pull_request:
    branches: [master]
    paths:
      - '*.md'
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.release-please-manifest.json'
      - '.gitignore'
      - '.editorconfig'
      - '.notestignore'
      - '.dockerignore'
      - '.golangci.yml.bak'
      - 'LICENSE'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  # 前置：判定本次变更集是否为「纯文档/忽略路径」。
  #   - pull_request：比较 base sha → HEAD（checkout 为 merge ref，diff 即 PR 改动）。
  #   - push（master 合并）：比较 event.before → HEAD。
  # 任一改动不在忽略清单 ⇒ docsonly=false ⇒ 全部占位 job skip。
  detect:
    name: Detect docs-only
    runs-on: ubuntu-latest
    outputs:
      docsonly: ${{ steps.d.outputs.docsonly }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: d
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="${BASE:-HEAD~1}"
          changed="$(git diff --name-only "$base" HEAD || true)"
          # 首次提交等极端兜底：base 不可用则与空树比。
          if [ -z "$changed" ]; then
            n="$(git hash-object -t tree /dev/null 2>/dev/null || echo "")"
            [ -n "$n" ] && changed="$(git diff --name-only "$n" HEAD || true)"
          fi
          echo "=== changed files (vs $base) ==="
          printf '%s\n' "$changed" | sed 's/^/  /'
          non_doc=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # 与 ci.yml paths-ignore 清单保持同一 fnmatch 语义（逐条）。
            if printf '%s' "$f" | grep -qE '(^|/)[^/]*\.md$|^docs/|^CHANGELOG\.md$|^\.release-please-manifest\.json$|^\.gitignore$|^\.editorconfig$|^\.notestignore$|^\.dockerignore$|^\.golangci\.yml\.bak$|^LICENSE$'; then
              :
            else
              echo "  → 非文档文件: $f"
              non_doc=1
            fi
          done <<< "$changed"
          if [ -z "$non_doc" ]; then
            echo "docsonly=true"
            echo "docsonly=true" >> "$GITHUB_OUTPUT"
          else
            echo "docsonly=false"
            echo "docsonly=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: detect
    if: needs.detect.outputs.docsonly == 'true'
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Docs-only OK
        run: echo "文档改动：占位（真实 lint 由 ci.yml 负责）"

  test:
    needs: detect
    if: needs.detect.outputs.docsonly == 'true'
    name: Test (ubuntu, +Vault)
    runs-on: ubuntu-latest
    steps:
      - name: Docs-only OK
        run: echo "文档改动：占位"

  test-windows:
    needs: detect
    if: needs.detect.outputs.docsonly == 'true'
    name: Test (windows)
    runs-on: windows-latest
    steps:
      - name: Docs-only OK
        run: echo "文档改动：占位"

  test-submodules:
    needs: detect
    if: needs.detect.outputs.docsonly == 'true'
    name: Test Sub-Modules (cmd + ext + hub + mesh)
    runs-on: ubuntu-latest
    steps:
      - name: Docs-only OK
        run: echo "文档改动：占位"

  e2e:
    needs: detect
    if: needs.detect.outputs.docsonly == 'true'
    name: E2E (real binaries) (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Docs-only OK
        run: echo "文档改动：占位"

  sonar:
    needs: detect
    if: needs.detect.outputs.docsonly == 'true'
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - name: Docs-only OK
        run: echo "文档改动：占位"

  ui-e2e:
    needs: detect
    if: needs.detect.outputs.docsonly == 'true'
    name: UI E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Docs-only OK
        run: echo "文档改动：占位"
