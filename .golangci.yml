version: "2"
# 语言版本对齐【最低依赖】原则：保持 1.26，不要把 run.go 抬到 1.27。
# golangci-lint 官方 releases 二进制长期以 go1.26 构建（见 golangci/golangci-lint#6643：
# 「releases 页面与 Docker 镜像 binary 以 go1.26 构建」），若 run.go = 1.27 而工具链是
# go1.26 构建会直接硬错「the Go language version used to build golangci-lint is lower
# than the targeted Go version」。go.mod 的 go 指令抬到 1.27 不受影响——run.go 只管 lint
# 采用的 Go 语言规则下限。
run:
  go: "1.26"
linters:
  enable:
    - containedctx # 对齐 Sonar S8242（结构体持 context.Context 字段）；豁免见下方规则与 nolint:containedctx
    - gocritic
    - gocognit # 对齐 Sonar S3776（认知复杂度），阈值 min 15 与 Sonar 默认一致；豁免仅限人工确认的设计保留场景
    - gosec
    - paralleltest
    - reassign
    - revive
    - thelper
    - whitespace
  settings:
    errcheck:
      check-type-assertions: true
    gosec:
      excludes:
        - G101
        - G115
        - G117
        - G306
        - G404
        - G703
        - G705
    gocognit:
      # 与 Sonar S3776 阈值一致（>15 告警）；测试与 tools 走下方 exclusions（与 sonar 的 test/tools 排除对称）
      min-complexity: 15
    govet:
      enable:
        - shadow
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
    revive:
      rules:
        - name: unused-parameter
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
      - linters:
          - paralleltest
        path: _test\.go
      - linters:
          - gosec
        path: _test\.go
      - linters:
          - thelper
        path: cmd/.*_test\.go
      - linters:
          - errcheck
          - gosec
          - gocognit # 对齐 sonar.exclusions=tools/**：工具目录不参与复杂度门禁
        path: tools/
      - linters:
          - containedctx
          - gocognit
        path: _test\.go # 对齐 sonar.test.inclusions（_test.go 标记为 TEST 不计入 count）；测试保留必要宽/测试底座 ctx
      - linters:
          - revive
        path: pkg/server/config\.go
      - linters:
          - revive
        path: pkg/tunnel/xfer/internal/tcp/tcp\.go
      - linters:
          - revive
        path: pkg/server/metrics_test_extra\.go
      - linters:
          - errcheck
        path: pkg/tunnel/tunnel_mux\.go
      - linters:
          - errcheck
        path: pkg/server/handlers\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
