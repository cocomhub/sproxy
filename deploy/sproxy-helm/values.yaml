# sproxy Helm chart 默认值。
# 覆盖方式：helm install sproxy ./deploy/sproxy-helm --set image.tag=v0.15.0

image:
  repository: ghcr.io/cocomhub/sproxy
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 18083

# 滚动更新策略（11.6-③ 多副本不中断）：maxUnavailable=0 → 新副本 Ready 前不删旧 Pod；
# maxSurge=1 → 滚动期间多起 1 个。单副本场景与 Recreate 行为等价（零回归）。
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# PodDisruptionBudget（11.6-③）：自愿中断（节点排水/kubectl drain）时保证 minAvailable 副本存活。
# replicaCount=0 与 minAvailable=1 冲突 → 模板 required 拒绝渲染（fail-closed）。
pdb:
  enabled: true
  minAvailable: 1

# Ingress（11.5-⑫）：默认关闭零回归；开启时指向 Service（ClusterIP），
# 边缘 Ingress Controller 终结 TLS。与 sproxy 内置 TLS 互操作：边缘 TLS 时
# 建议关内置 tls（tls.enabled: false），避免双层 TLS。
ingress:
  enabled: false
  className: ""            # 如 nginx；空 = 集群默认 IngressClass
  annotations: {}          # 用户附加注解（合并）
  hosts:
    - host: sproxy.example.com
      paths:
        - /
  tls:
    enabled: false
    secretName: sproxy-tls
    certManager: false     # true → 自动注入 cert-manager.io/cluster-issuer 注解
    clusterIssuer: letsencrypt-prod

# 持久化存储（多租户存储根）
persistence:
  enabled: true
  size: 10Gi
  storageClass: ""
  accessMode: ReadWriteOnce

# 资源配置
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 1Gi

# 探针：livenessProbe 用 /healthz（进程存活）；readinessProbe 用 /readyz
# （依赖就绪才计入 Ready，滚动升级真正等业务就绪，避免升级期间 503）。
probe:
  initialDelaySeconds: 5
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

# 环境变量（覆盖 config 文件；优先级 CLI flag > env > config file > 默认值）
env:
  SPROXY_ADDR: ":18083"
  SPROXY_STORAGE_ROOT: "/app/storage"
  SPROXY_LOG_LEVEL: "info"

# 自定义配置（挂载为 /app/sproxy.yaml；默认空=使用 env 配置）
config: ""

# 敏感配置（roadmap 11.10-⑦ IaC）：默认不创建 Secret（create=false 零行为变化）。
# create=true 时以 stringData 注入环境变量（SPROXY_TUNNEL_KEY/SPROXY_API_KEYS/SPROXY_METRICS_TOKEN），
# 不落 ConfigMap 明文。生产建议用 --set secret.create=true --set secret.apiKeys=... 或外部 secret 引用。
secret:
  create: false
  tunnelKey: ""      # 隧道密钥（旧配置兼容；凭据 Ring 化后通常不需要）
  apiKeys: ""        # 多用户 API 密钥（逗号分隔 user:key）
  metricsToken: ""   # /metrics 访问令牌

# 水平扩缩容（HPA，roadmap 11.10-⑦）：默认关闭（enabled=false 零行为变化）。
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPU: 70
