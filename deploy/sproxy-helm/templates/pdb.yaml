{{- if .Values.pdb.enabled }}
{{- if eq (int .Values.replicaCount) 0 }}
{{- required "pdb.enabled=true 时 replicaCount 不能为 0（minAvailable 与零副本冲突）" (printf "replicaCount=%d" (int .Values.replicaCount)) }}
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "sproxy.fullname" . }}
  labels:
    app.kubernetes.io/name: sproxy
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sproxy
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
