sonar.projectKey=cocomhub_sproxy
sonar.organization=cocomhub
sonar.host.url=https://sonarcloud.io
sonar.go.coverage.reportPaths=build/coverage/*.out,build/cover.out
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.exclusions=test/**,tools/**,build/**,.claude/**,.pi/**,.trae/**,.cursor/**
# 声明测试代码范围：sonar.test.inclusions 把 *_test.go 标记为 TEST 文件，
# 从覆盖分母/重复率/代码坏味道剔除。不能只用 sonar.test.exclusions（其语义是
# "已识别的测试中再排除"，单独用不生效，test 文件会继续稀释覆盖指标）。
sonar.tests=.
sonar.test.inclusions=**/*_test.go
