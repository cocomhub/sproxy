sonar.projectKey=cocomhub_sproxy
sonar.organization=cocomhub
sonar.host.url=https://sonarcloud.io
sonar.go.coverage.reportPaths=build/coverage/*.out,build/cover.out
sonar.sourceEncoding=UTF-8
sonar.sources=.
# 排除非源码目录：test/tools/scripts/build/.claude/.pi/.trae/.cursor。
# scripts/ 是部署辅助脚本（无 issue 但 ncloc 污染覆盖分母）；test/** 排除非 _test.go。
sonar.exclusions=test/**,tools/**,scripts/**,build/**,.claude/**,.pi/**,.trae/**,.cursor/**
# 测试文件声明（三件套缺一不可）：
#  - sonar.tests=. 声明测试根；
#  - sonar.test.inclusions 把 *_test.go 与 *.test.js 标记为 TEST 文件（从 main code
#    剔除，不计覆盖分母/重复率/质量门禁）；.test.js 若不加入会被当 main code 扫出
#    大量 JS issue（sclient.test.js 51 项实证）；
#  - sonar.test.exclusions 在测试文件集内再排除 test/ 与 tools/：被标记 TEST 的
#    test/e2e_*.go 已不受 sonar.exclusions（main 专用）管辖，必须在此层排除。
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/*.test.js
sonar.test.exclusions=test/**,tools/**
