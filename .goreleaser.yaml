# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# v2.8+ schema
version: 2

project_name: sproxy

# 嵌套模块 tag（cmd/sproxy/vX.Y.Z、cmd/sclient/vX.Y.Z、web/e2e/vX.Y.Z …）不是根项目版本：忽略它们，
# 否则 goreleaser 解析到的版本会被污染（快照实测得到 `vcmd/sclient/v0.11.1-SNAPSHOT-…`），
# release notes footer 的 {{ .PreviousTag }} 比较链接也会指向嵌套 tag。
# v0.17.0 发布事故（2026-09-21）：tag-release.sh 补建的 web/e2e/v0.17.0 被 git describe
# 命中 → `failed to parse tag 'web/e2e/v0.17.0' as semver`。子 module 列表与 go.work use 同步
# （scripts/tag-release.sh 动态扫描同源），此处全量枚举各模块前缀；新增子 module 时须同步补。
# 门禁：internal/archcheck/build_flags_alignment_test.go。
git:
  ignore_tags:
    - "cmd/*"
    - "pkg/*"
    - "web/*"

# 编译前必须先生成 internal/buildmeta 的 embed 依赖 build/dirty_info.txt —— 该文件
# 被 .gitignore 忽略，由 `make prepare` 生成。GoReleaser 不走 Makefile，因此必须有
# before.hooks，否则干净 checkout 下直接报：
#   internal/buildmeta/buildmeta.go:14:12:
#   pattern build/dirty_info.txt: no matching files found
# （v0.11.1 Release run 34958665107 实测，发布因此失败、制品缺失）。
# 门禁：internal/archcheck/makefile_bench_deps_test.go。
before:
  hooks:
    - make prepare

builds:
  - id: sproxy
    main: ./cmd/sproxy
    binary: sproxy
    env:
      - CGO_ENABLED=0
    # -trimpath 是 go build 开关（对应 Makefile 里 -ldflags 之外的 -trimpath）。
    flags:
      - -trimpath
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    # 必须与 `make build`（Makefile GO_LD_FLAGS_X）对齐：同键集、同取值语义、同 v 前缀版本。
    # `-w -s` 为发布瘦身（本地 make build 保留符号便于调试），属允许的打包差异。
    # 门禁：internal/archcheck/build_flags_alignment_test.go。
    ldflags:
      - -w -s
      - -X main.Version=v{{ .Version }}
      - -X main.BuildAt={{ .Date }}
      - -X github.com/cocomhub/buildinfo.CommitID={{ .ShortCommit }}
      - -X github.com/cocomhub/buildinfo.Branch={{ .Env.SPROXY_BRANCH }}
      - -X github.com/cocomhub/buildinfo.ReleaseURL=https://github.com/cocomhub/sproxy/releases

  - id: sclient
    main: ./cmd/sclient
    binary: sclient
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    # 与 sproxy build 完全一致，见上方注释与门禁。
    ldflags:
      - -w -s
      - -X main.Version=v{{ .Version }}
      - -X main.BuildAt={{ .Date }}
      - -X github.com/cocomhub/buildinfo.CommitID={{ .ShortCommit }}
      - -X github.com/cocomhub/buildinfo.Branch={{ .Env.SPROXY_BRANCH }}
      - -X github.com/cocomhub/buildinfo.ReleaseURL=https://github.com/cocomhub/sproxy/releases

archives:
  - id: default
    ids:
      - sproxy
      - sclient
    formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - config.example.yaml
      - README.md
      - LICENSE
      - docs/*.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}"

changelog:
  # 单源：CHANGELOG.md 与 Release 正文由 release-please 维护，GoReleaser 不再自行生成。
  disable: true
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch
  groups:
    - title: "新功能"
      regexp: "^feat(\\s*\\(.*\\))?:"
      order: 0
    - title: "缺陷修复"
      regexp: "^fix(\\s*\\(.*\\))?:"
      order: 1
    - title: "性能优化"
      regexp: "^perf(\\s*\\(.*\\))?:"
      order: 2
    - title: "代码重构"
      regexp: "^refactor(\\s*\\(.*\\))?:"
      order: 3
    - title: "其他"
      order: 999

release:
  github:
    owner: cocomhub
    name: sproxy
  # 模式 keep-existing：GitHub Release 的标题/正文由 release-please 负责，GoReleaser 只
  # 上传制品与 checksums（不重写 notes）。若该 tag 尚无 Release，则按 header/footer 新建。
  mode: keep-existing
  draft: false
  prerelease: auto
  header: |
    ## sproxy {{ .Version }} ({{ .Date }})

    发布的二进制包含 sproxy 服务端和 sclient 客户端。

    ### 安装方式

    ```bash
    # 从 Assets 下载对应平台的预编译二进制（tar.gz / zip），解压后即可使用，
    # 或使用发行版包（deb / rpm）与容器镜像 ghcr.io/cocomhub/sproxy。
    # 注：cmd/sproxy 与 cmd/sclient 是嵌套 Go module，暂不支持 go install <pkg>@<tag>。
    ```

  footer: |
    **完整变更日志**: https://github.com/cocomhub/sproxy/compare/{{ .PreviousTag }}...{{ .Tag }}

nfpms:
  - id: sproxy
    package_name: sproxy
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    homepage: https://github.com/cocomhub/sproxy
    description: 轻量文件上传/下载/删除服务 + 加密隧道
    maintainer: Cocomhub Authors
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin
    contents:
      - src: config.example.yaml
        dst: /etc/sproxy/config.yaml
      - src: docs/*.md
        dst: /usr/share/doc/sproxy/

