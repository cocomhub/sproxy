dockers_v2:
  - id: sproxy
    dockerfile: Dockerfile
    ids:
      - sproxy
      - sclient
    images:
      - "ghcr.io/cocomhub/sproxy"
    tags:
      - "{{ .Version }}"
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64
    # 用户明确不需要供应链安全：不生成镜像 SBOM。
    sbom: false
    labels:
      "org.opencontainers.image.title": "sproxy"
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.licenses": "Apache-2.0"
