addr: ":18083"
uploads_dir: "./uploads"

# 单次普通上传（非分块）最大字节数，超过返回 413。0 或不填使用默认 1 GiB。
# max_upload_bytes: 1073741824

server_timeouts:
  read_header: "5s"
  read: "30s"
  write: "30s"
  idle: "60s"
  # graceful shutdown 超时：收到 SIGINT/SIGTERM 后等待活跃请求结束的最长时间。
  # 0 或不填使用默认 30s。超时后强制关闭剩余连接。
  shutdown: "30s"

log_level: "info"
log_format: "text"
max_header_bytes: 1048576

# Web 领域方法传输行为（默认隧道）。
# web:
#   tunnel: true   # true=Web 领域方法默认走加密隧道（由 SK 派生密钥）；false=走直连 SproxySig
#                  # 页面另有 localStorage 调试开关可临时覆盖（仅调试用）。

# TLS 配置（默认启用）
tls:
  enabled: true
  # cert_file: "certs/_wildcard.sproxy.local.pem"
  # key_file: "certs/_wildcard.sproxy.local-key.pem"
  # auto_tls 默认 true，证书/私钥缺失时自动生成 ECDSA P-256 自签证书。
  # 若已有证书文件，auto_tls 不会覆盖已有文件。
  # 要显式禁用自签证书生成，取消注释并设为 false：
  # auto_tls: false

# SproxySig 请求签名认证（每 mesh 一对 AK/SK；生产环境必须设置）。
# 启用后，除 /healthz、/version、/ui/、POST /tunnel 之外所有路由都要求
# Authorization: SproxySig v=1 ... 请求签名头。
# 生成 AK/SK：sclient access-key create [--mesh <name>]
# 注意：未配置 access_keys（且 api_keys 未启用）时 sproxy 拒绝启动（fail-fast）。
# 下面为开发示例凭据，生产环境务必用 `sclient access-key create` 生成并更换。
access_keys:
  - key: "sk-00000000000000000000000000000000"
    secret: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

# 多用户 API 密钥（Bearer，与 access_keys 互斥且优先；可选）。
# 提供 read/write 权限分级，适合多用户 HTTP 文件访问；但不支持隧道/hub——
# 隧道密钥与 hub 注册准入均来自 access_keys（hub.enabled 时强制要求 access_keys）。
# api_keys:
#   enabled: true
#   keys:
#     - key: "user-token-1"
#       permission: "read"    # read=只读 GET/HEAD；write=读写（默认）
#     - key: "user-token-2"
#       permission: "write"

# 速率限制（默认关闭；enabled: true 时限制 tunnel handler）
# rate_limit:
#   enabled: false
#   requests: 10
#   window: "1s"

# 分块上传设置
# chunk_size: 4194304               # 每块大小 (4MB)
# max_chunk_size: 67108864          # 最大分块大小 (64MB)，仅客户端使用
# max_chunk_upload_bytes: 8388608   # 单块请求体服务端最大限制 (8MB)，超过返回 413
# upload_session_ttl: "24h"         # 未完成上传会话保留时间，过期自动清理

# 文件版本管理（默认关闭）。上传覆盖前自动保存旧版本到 .__versions__/ 目录。
# versioning:
#   enabled: true
#   max_versions: 10                # 保留最近的 N 个版本，超出自动清理

# 云端离线下载（多任务/任务组）配置
# cloud_sync_threshold: 20971520            # 同步下载阈值（默认 20 MiB；当前 handler 提交时大小未知恒异步，字段保留供未来按大小同步）
# cloud_max_concurrent: 3                   # 最大并发下载数
# cloud_max_batch_urls: 100                 # 批量/组下载单次最大 URL 数，超过服务端返回 400（默认 100）
# cloud_downloader: "http"                  # 云端下载器名称（默认 http；当前仅内置 http 实现）
# cloud_task_ttl: "24h"                     # 完成任务保留时间，过期自动清理
# cloud_failed_task_ttl: "1h"               # 失败/取消任务保留时间
# cloud_download_timeout: "30m"             # 单次下载尝试整体超时（超时后自动重试续传）
# cloud_download_idle_timeout: "1m"         # 响应体读取空闲超时：超过该时长未收到数据即中断本次尝试
# cloud_max_retries: 10                     # 瞬时失败（网络/5xx/超时）最大重试次数
# cloud_retry_delay: "10s"                  # 重试间隔
# cloud_download_allow_private: false       # 允许下载私有 IP 地址（默认关闭，SSRF 防护）

# 云端下载任务归档（tar.gz）加固：
# cloud_archive_max_bytes 限制单次云归档打包的原始文件大小总和（字节），0 或不填=不限制。
# 无论是否设置，都受 max_storage_bytes（TryReserve）兜底；归档文件计入 __cloud_archives__/ 目录空间。
# 同名归档文件已存在时返回 409（O_EXCL 防覆盖）；打包完成后按磁盘实际大小对账预留配额。
# cloud_archive_max_bytes: 10737418240   # 10 GiB 示例

# Hub 中继（mesh 内网穿透，默认关闭）。
# 节点注册准入由顶层 access_keys 提供（AK/HMAC proof 证明持有 SK，无需独立 relay_token）。
# hub:
#   enabled: true
#   node_id: "node-a"               # 本节点 ID（mesh connect / relay dial 的目标）
#   max_connections: 256             # 同时处理的中继连接数上限（0/缺省默认 256；I30 防连接洪泛）
#   persist_file: ""                # hub 状态持久化文件路径（节点注册/信令收件箱重启间保留）；空=关闭（默认）
#   dht: ""                        # 节点发现表实现：""（默认）= 内置内存 DHT；"kad" = Kademlia（ext/kad，XOR 距离路由表）
#                                   # 启用 kad 后注册节点喂入 DHT，/api/hub/nodes 合并 DHT 候选（路由表仍权威，DHT 只提供候选/发现）
#   dht_seeds: []                  # DHT 引导种子节点地址（仅 dht: kad 时消费；空=不引导，预留多 hub 组网）
#   transports:
#     ws:
#       enabled: true
#       # path 已废弃（S36）：WS 升级路径固定为 /ws，配置非默认值不生效（启动时记录警告并忽略）
#       # path: /ws
#     tcp:
#       enabled: false      # 裸 TCP 中继（独立 raw TCP listener，默认关闭；显式开启才生效）
#       listen: "127.0.0.1:18084"  # TCP 监听地址（为空回落默认 127.0.0.1:18084，loopback；
#                                  # 远程节点可达需显式配 ":18084" 或具体网卡 IP。注册准入由
#                                  # access_keys 的 SproxySig 保证，未配置时拒绝所有注册）