addr: ":18083"
uploads_dir: "./uploads"

# 单次普通上传（非分块）最大字节数，超过返回 413。0 或不填使用默认 1 GiB。
# max_upload_bytes: 1073741824

# tunnel_key 留空时 sproxy 自动生成 64 位 hex 密钥并回写到配置文件
# 可通过 `sclient genkey` 手动生成
# tunnel_key: ""

server_timeouts:
  read_header: "5s"
  read: "30s"
  write: "30s"
  idle: "60s"
  # graceful shutdown 超时：收到 SIGINT/SIGTERM 后等待活跃请求结束的最长时间。
  # 0 或不填使用默认 30s。超时后强制关闭剩余连接。
  shutdown: "30s"

log_level: "info"
log_format: "text"
max_header_bytes: 1048576

# TLS 配置（默认启用）
tls:
  enabled: true
  # cert_file: "certs/_wildcard.sproxy.local.pem"
  # key_file: "certs/_wildcard.sproxy.local-key.pem"
  # auto_tls 默认 true，证书/私钥缺失时自动生成 ECDSA P-256 自签证书。
  # 若已有证书文件，auto_tls 不会覆盖已有文件。
  # 要显式禁用自签证书生成，取消注释并设为 false：
  # auto_tls: false

# Bearer Token 认证（默认关闭，生产环境必须设置）
# 启用后，除 /healthz、/version、/ui/、POST /tunnel 之外所有路由都要求
# Authorization: Bearer <token> 请求头。
# auth_token: "your-secret-token"

# 速率限制（默认关闭；enabled: true 时限制 tunnel handler）
# rate_limit:
#   enabled: false
#   requests: 10
#   window: "1s"

# 分块上传设置
# chunk_size: 4194304               # 每块大小 (4MB)
# max_chunk_size: 67108864          # 最大分块大小 (64MB)，仅客户端使用
# max_chunk_upload_bytes: 8388608   # 单块请求体服务端最大限制 (8MB)，超过返回 413
# upload_session_ttl: "24h"         # 未完成上传会话保留时间，过期自动清理

# 文件版本管理（默认关闭）。上传覆盖前自动保存旧版本到 .__versions__/ 目录。
# versioning:
#   enabled: true
#   max_versions: 10                # 保留最近的 N 个版本，超出自动清理

# 云端离线下载（多任务/任务组）配置
# cloud_sync_threshold: 20971520            # 小于该字节数的任务同步返回，其余异步（默认 20 MiB）
# cloud_max_concurrent: 3                   # 最大并发下载数
# cloud_task_ttl: "24h"                     # 完成任务保留时间，过期自动清理
# cloud_failed_task_ttl: "1h"               # 失败/取消任务保留时间
# cloud_download_timeout: "30m"             # 单次下载尝试整体超时（超时后自动重试续传）
# cloud_download_idle_timeout: "1m"         # 响应体读取空闲超时：超过该时长未收到数据即中断本次尝试
# cloud_max_retries: 10                     # 瞬时失败（网络/5xx/超时）最大重试次数
# cloud_retry_delay: "10s"                  # 重试间隔
# cloud_download_allow_private: false       # 允许下载私有 IP 地址（默认关闭，SSRF 防护）